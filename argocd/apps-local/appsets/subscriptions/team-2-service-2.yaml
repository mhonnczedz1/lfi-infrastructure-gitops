# team-2-service-2 on the local cluster: one Application per environment the team has.
#
# Generated by scripts/gen-appsets.sh from platform/subscriptions/local/team-2-service-2.yaml
# and platform/profiles/web-service.yaml. Do not edit by hand: change those and
# regenerate.
#
# Which environments: every <env>/env.yaml under local/ in the team's
# config repository. The team adds an environment by adding a directory; nothing
# here changes, though its namespace must exist (Terraform creates
# <prefix>-<env> for each name in its environments variable).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: local-team-2-service-2
  namespace: argocd
  labels:
    platform/service: team-2-service-2
    platform/team: team-2
    platform/profile: web-service
spec:
  # Go templates, with an error on any missing key instead of a silent blank.
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/mhonnczedz1/lfi-service-2-config.git
        revision: HEAD
        files:
          - path: 'local/*/env.yaml'
  template:
    metadata:
      name: '{{ .env }}-team-2-service-2'
      labels:
        platform/service: team-2-service-2
        platform/env: '{{ .env }}'
      # Deleting the Application (unsubscribing, or a team removing an
      # environment directory) deletes what it deployed.
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      # Not "default": the teams project limits which repositories may be read,
      # which namespaces may be written, and forbids cluster-scoped resources.
      project: teams
      source:
        repoURL: https://github.com/mhonnczedz1/lfi-service-2-config.git
        targetRevision: HEAD
        # path.path is the directory env.yaml sits in, for example local/dev.
        path: '{{ .path.path }}'
      destination:
        server: https://kubernetes.default.svc
        # A team may name its own namespace in env.yaml. The project still
        # refuses any that does not start with the platform's prefix.
        namespace: '{{ get . "namespace" | default (printf "%s-%s" "platform" .env) }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        retry:
          limit: 3
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 2m
  templatePatch: |
    spec:
      source:
        targetRevision: {{ dig "overrides" "targetRevision" "HEAD" . | quote }}
      syncPolicy:
        automated:
          selfHeal: {{ dig "overrides" "selfHeal" true . }}
