# One Application per directory addons/local/<name>/ that holds an addon.yaml.
# The Git files generator reads each addon.yaml and passes its fields to the
# template, so the add-on's name, namespace and chart come from the file, not
# from here. Values come from values.yaml beside it.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons-local
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/mhonnczedz1/lfi-infrastructure-gitops.git
        revision: HEAD
        files:
          - path: addons/local/*/addon.yaml
  template:
    metadata:
      name: 'addon-{{ .name }}-local'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      # Two sources: the chart, and this repo under the name "values" so the
      # chart's valueFiles can point into it with $values.
      sources:
        - repoURL: '{{ .chart.repo }}'
          chart: '{{ .chart.name }}'
          targetRevision: '{{ .chart.version }}'
          helm:
            releaseName: '{{ .name }}'
            # An add-on with no values.yaml runs on the chart's defaults.
            ignoreMissingValueFiles: true
            valueFiles:
              - '$values/{{ .path.path }}/values.yaml'
        - repoURL: https://github.com/mhonnczedz1/lfi-infrastructure-gitops.git
          targetRevision: HEAD
          ref: values
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          # Add-ons create their own namespaces. Services never do: Terraform
          # owns those.
          - CreateNamespace=true
        retry:
          limit: 3
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 2m
