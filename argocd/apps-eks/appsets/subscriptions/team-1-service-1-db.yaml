# team-1-service-1-db on the eks cluster: one Application per environment the team has.
#
# Generated by scripts/gen-appsets.sh from team-1-service-1-db's entry in
# platform/subscribers.yaml and the db-service profile (templates repository,
# profiles/db-service.yaml at v1.0.0). Do not edit by hand: change those and
# regenerate.
#
# Which environments: every <env>/env.yaml under service-1-db/eks/ in the team's
# config repository. The team adds an environment by adding a directory; nothing
# here changes, though its namespace must exist (Terraform creates
# <prefix>-<env> for each name in its environments variable).
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: eks-team-1-service-1-db
  namespace: argocd
  labels:
    platform/service: team-1-service-1-db
    platform/team: team-1
    platform/profile: db-service
  annotations:
    # root prunes whatever is removed from argocd/, and pruning this set
    # would take the database's Application with it. This keeps the set
    # until a person deletes it, so unsubscribing never removes it. root
    # shows OutOfSync until then, which is the reminder.
    argocd.argoproj.io/sync-options: Prune=false
spec:
  # Go templates, with an error on any missing key instead of a silent blank.
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: https://github.com/mhonnczedz1/lfi-service-1-config.git
        revision: HEAD
        files:
          - path: 'service-1-db/eks/*/env.yaml'
  template:
    metadata:
      name: '{{ .env }}-team-1-service-1-db'
      labels:
        platform/service: team-1-service-1-db
        platform/env: '{{ .env }}'
    # No finalizer: deleting the Application must not delete the database.
    spec:
      # Not "default": the teams project limits which repositories may be read,
      # which namespaces may be written, and forbids cluster-scoped resources.
      project: teams
      source:
        repoURL: https://github.com/mhonnczedz1/lfi-service-1-config.git
        targetRevision: HEAD
        # path.path is the directory env.yaml sits in, for example service-1-db/eks/dev.
        path: '{{ .path.path }}'
      destination:
        server: https://kubernetes.default.svc
        # A team may name its own namespace in env.yaml. The project still
        # refuses any that does not start with the platform's prefix.
        namespace: '{{ get . "namespace" | default (printf "%s-%s" "platform" .env) }}'
      syncPolicy:
        automated:
          # false: a file removed from Git must not delete the StatefulSet.
          prune: false
          selfHeal: true
        retry:
          limit: 3
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 2m
      ignoreDifferences:
        # volumeClaimTemplates are immutable after creation and the API server
        # returns them with defaulted fields, which ArgoCD reads as permanent
        # drift. Without this the Application sits OutOfSync forever.
        - group: apps
          kind: StatefulSet
          jsonPointers:
            - /spec/volumeClaimTemplates
  syncPolicy:
    # Deleting the set, or a directory disappearing from Git, leaves the
    # Applications and everything they deployed alone. Losing a database to
    # a bad merge is not a mistake Git history can undo.
    preserveResourcesOnDeletion: true
    applicationsSync: create-update
  templatePatch: |
    spec:
      source:
        targetRevision: {{ dig "overrides" "targetRevision" "HEAD" . | quote }}
