apiVersion: v1
kind: Service
metadata:
  name: service-2
  labels:
    app: service-2
spec:
  # Deliberately ClusterIP: service-2 is never reachable from outside
  # the cluster. There is no Ingress for it, and there should not be.
  type: ClusterIP
  selector:
    app: service-2
  ports:
    - name: http
      port: 8000
      targetPort: http
