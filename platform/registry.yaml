# The one place that says what exists at the project level: who owns it, which
# clusters it runs on, and what they are called. Services are NOT here: they are
# the entries in platform/subscribers.yaml. Scripts, the Makefile and the stamp
# script read this file. ArgoCD cannot, so scripts/gen-appsets.sh writes the few
# values the ApplicationSets need into them, and scripts/check-contract.sh fails
# if a generated file has drifted.
project: lfi
owner: mhonnczedz1
repo: lfi-infrastructure-gitops
stateBucket: tfstate-mhonnczedz1-local-platform
namespacePrefix: platform
# The tag of <project>-service-templates whose profiles/ the generator reads.
# Move it, and regenerate, to take a new release of the profiles.
profilesRef: v1.0.0
clusters:
  - name: local
    kind: k3d
    context: k3d-platform
    clusterName: platform
    stateKeyPrefix: local-platform
  - name: eks
    kind: eks
    context: lfi-eks
    clusterName: lfi-eks
    region: ap-southeast-2
    stateKeyPrefix: lfi-eks
