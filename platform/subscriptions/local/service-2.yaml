# service-2 on the local cluster. The ApplicationSets read this file.
name: service-2
team: team-2
role: the worker. Release and promote it first.
# The repo ArgoCD reads this service's manifests from. The team owns it.
configRepo: https://github.com/mhonnczedz1/lfi-service-2-config.git
# Which environments a release promotes between. Defaults to dev then prod.
promotion:
  from: dev
  to: prod
