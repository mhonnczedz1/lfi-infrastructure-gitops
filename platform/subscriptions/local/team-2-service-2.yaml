# team-2-service-2 on the local cluster: team-2 asks the platform to run service-2 here.
name: service-2
team: team-2
# Which platform template this runs under, and so which ArgoCD policy.
profile: web-service
# The repository ArgoCD reads this service's manifests from. The team owns it.
configRepo: https://github.com/mhonnczedz1/lfi-service-2-config.git
description: the worker. Release and promote it first.
# Which environments a release promotes between. Defaults to dev then prod.
promotion:
  from: dev
  to: prod
